stant distribution of money in the form of allocation is a distinguishing feature of financial relations.\",\"type\":\"true-false\",\"correct\":\"a\",\"explanation\":\"\",\"section\":\"SECTION I. Basic Quiz\",\"options\":[{\"label\":\"a\",\"text\":\"True\"},{\"label\":\"b\",\"text\":\"False\"}]},{\"id\":4,\"question\":\"The financial system can be defined as the network between financial markets and institutions.\",\"type\":\"true-false\",\"correct\":\"a\",\"explanation\":\"\",\"section\":\"SECTION I. Basic Quiz\",\"options\":[{\"label\":\"a\",\"text\":\"True\"},{\"label\":\"b\",\"text\":\"False\"}]},{\"id\":5,\"question\":\"The totality of subjects responsible for regulating financial relations is defined as the market.\",\"type\":\"true-false\",\"correct\":\"b\",\"explanation\":\"\",\"section\":\"SECTION I. Basic Quiz\",\"options\":[{\"label\":\"a\",\"text\":\"True\"},{\"label\":\"b\",\"text\":\"False\"}]},{\"id\":6,\"question\":\"Money creation and money emission are economically identical concepts.\",\"type\":\"true-false\",\"correct\":\"b\",\"explanation\":\"\",\"section\":\"SECTION I. Basic Quiz\",\"options\":[{\"label\":\"a\",\"text\":\"True\"},{\"label\":\"b\",\"text\":\"False\"}]},{\"id\":7,\"question\":\"The main objective of financial institutions is to efficiently use and allocate monetary funds.\",\"type\":\"true-false\",\"correct\":\"b\",\"explanation\":\"\",\"section\":\"SECTION I. Basic Quiz\",\"options\":[{\"label\":\"a\",\"text\":\"True\"},{\"label\":\"b\",\"text\":\"False\"}]},{\"id\":8,\"question\":\"A financial institution that transfers funds, in its own name, from surplus units to deficit units is called an intermediary.\",\"type\":\"true-false\",\"correct\":\"a\",\"explanation\":\"\",\"section\":\"SECTION I. Basic Quiz\",\"options\":[{\"label\":\"a\",\"text\":\"True\"},{\"label\":\"b\",\"text\":\"False\"}]},{\"id\":9,\"question\":\"Barter trade can be defined as exchange in a moneyless economy.\",\"type\":\"true-false\",\"correct\":\"a\",\"explanation\":\"\",\"section\":\"SECTION I. Basic Quiz\",\"options\":[{\"label\":\"a\",\"text\":\"True\"},{\"label\":\"b\",\"text\":\"False\"}]},{\"id\":10,\"question\":\"Cash and non-cash payment settlement can be understood as a manifestation of financial intermediation.\",\"type\":\"true-false\",\"correct\":\"a\",\"explanation\":\"\",\"section\":\"SECTION I. Basic Quiz\",\"options\":[{\"label\":\"a\",\"text\":\"True\"},{\"label\":\"b\",\"text\":\"False\"}]},{\"id\":11,\"question\":\"Payment settlement is the movement of money that occurs in the process of satisfying consumption.\",\"type\":\"true-false\",\"correct\":\"a\",\"explanation\":\"\",\"section\":\"SECTION I. Basic Quiz\",\"options\":[{\"label\":\"a\",\"text\":\"True\"},{\"label\":\"b\",\"text\":\"False\"}]},{\"id\":12,\"question\":\"Electronic money such as credit cards cannot perform the function of a unit of account as well as paper money can.\",\"type\":\"true-false\",\"correct\":\"a\",\"explanation\":\"\",\"section\":\"SECTION I. Basic Quiz\",\"options\":[{\"label\":\"a\",\"text\":\"True\"},{\"label\":\"b\",\"text\":\"False\"}]},{\"id\":13,\"question\":\"In 1954, Bank of America first launched a credit card program called BankAmericard.\",\"type\":\"true-false\",\"correct\":\"b\",\"explanation\":\"\",\"section\":\"SECTION I. Basic Quiz\",\"options\":[{\"label\":\"a\",\"text\":\"True\"},{\"label\":\"b\",\"text\":\"False\"}]},{\"id\":14,\"question\":\"By method of transfer, checks are classified into two types: ordinary checks and registered (nominal) checks.\",\"type\":\"true-false\",\"correct\":\"a\",\"explanation\":\"\",\"section\":\"SECTION I. Basic Quiz\",\"options\":[{\"label\":\"a\",\"text\":\"True\"},{\"label\":\"b\",\"text\":\"False\"}]},{\"id\":15,\"question\":\"A settlement made on the basis of an invoice document, which always requires the payer's consent, is called settlement by payment order.\",\"type\":\"true-false\",\"correct\":\"b\",\"explanation\":\"\",\"section\":\"SECTION I. Basic Quiz\",\"options\":[{\"label\":\"a\",\"text\":\"True\"},{\"label\":\"b\",\"text\":\"False\"}]},{\"id\":16,\"question\":\"The establishment of the \\\"Trade and Industrial Bank\\\" on June 24, 1924 is considered to have laid the foundation for Mongolia's two-tier banking system.\",\"type\":\"true-false\",\"correct\":\"b\",\"explanation\":\"\",\"section\":\"SECTION I. Basic Quiz\",\"options\":[{\"label\":\"a\",\"text\":\"True\"},{\"label\":\"b\",\"text\":\"False\"}]},{\"id\":17,\"question\":\"A legal debt instrument certifying a promise to pay a certain amount of money within a set period is called a bill of exchange.\",\"type\":\"true-false\",\"correct\":\"a\",\"explanation\":\"\",\"section\":\"SECTION I. Basic Quiz\",\"options\":[{\"label\":\"a\",\"text\":\"True\"},{\"label\":\"b\",\"text\":\"False\"}]},{\"id\":18,\"question\":\"A card that makes payments based on the amount of money accumulated in the account is called a debit card.\",\"type\":\"true-false\",\"correct\":\"a\",\"explanation\":\"\",\"section\":\"SECTION I. Basic Quiz\",\"options\":[{\"label\":\"a\",\"text\":\"True\"},{\"label\":\"b\",\"text\":\"False\"}]},{\"id\":19,\"question\":\"A settlement in which the parties mutually act as both payer and payee is called clearing settlement.\",\"type\":\"true-false\",\"correct\":\"a\",\"explanation\":\"\",\"section\":\"SECTION I. Basic Quiz\",\"options\":[{\"label\":\"a\",\"text\":\"True\"},{\"label\":\"b\",\"text\":\"False\"}]},{\"id\":20,\"question\":\"The establishment of the \\\"Bank for Settling Money Circulation on Many Roads\\\" in 1253 is considered to have laid the foundation for Mongolia's one-tier banking system.\",\"type\":\"true-false\",\"correct\":\"b\",\"explanation\":\"\",\"section\":\"SECTION I. Basic Quiz\",\"options\":[{\"label\":\"a\",\"text\":\"True\"},{\"label\":\"b\",\"text\":\"False\"}]},{\"id\":21,\"question\":\"The Bank of Mongolia is a legal entity established by the state, dependent on the government, and conducts independent operations
